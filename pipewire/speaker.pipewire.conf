context.modules = [{
  name = libpipewire-module-filter-chain
  args = {
    node.description = "Speakers / EQ"
    media.name = "Speakers / EQ"

    audio.channels = 2
    audio.position = [FL FR]

    capture.props = {
      node.name = "capture.wm2_speakers"
      media.class = Audio/Sink
      priority.driver = 1009
      priority.session = 1009
    }

    playback.props = {
      node.name = "playback.wm2_speakers"
      node.passive = true
      node.target = "alsa_output.pci-0000_64_00.6.analog-stereo"
    }

    filter.graph = {
      nodes = [
        ## Control block / Input
        ## -------------------------
        {
          ## Volume (linear)
          type = builtin, name = vol, label = linear,
          control = { Mult = 1.0, Add = 0.0 },
        }
        {
          ## Base Gain (linear)
          type = builtin, name = base_gain, label = clamp,
          control = { Min = 0.07, Max = 1.0 },
        }
        {
          ## Base Gain (dB)
          type = builtin, name = base_gain_db, label = log,
          control = { Base = 10.0, M1 = 1.0, M2 = 20.0 },
        }

        ## Control block / Equalizer
        ## -------------------------

        {
          type = builtin, name = eq_band_2_gain, label = linear,
          control = { Mult = -1.0, Add = 9.0 },
        }

        ## DSP block
        ## -------------------------
        {
          type = builtin, name = eq_band_1, label = bq_lowshelf,
          control = { Freq = 60.0, Q = 2.0, Gain = -19.0 },
        }
        {
          type = builtin, name = eq_band_2, label = bq_peaking,
          control = { Freq = 170.0, Q = 0.7, Gain = 20.0 },
        }
        {
          type = builtin, name = eq_band_3, label = bq_peaking,
          control = { Freq = 920.0, Q = 1.0, Gain = -7.0 },
        }
        {
          type = builtin, name = eq_band_4, label = bq_peaking,
          control = { Freq = 4250.0, Q = 1.3, Gain = -10.0 },
        }
        {
          type = builtin, name = eq_band_5, label = bq_highshelf,
          control = { Freq = 10000.0, Q = 0.9, Gain = 14.0 },
        }
        {
          type = builtin, name = post_gain, label = linear,
          control = { Mult = 1.0, Add = 0.0 },
        }
      ]

      inputs = ["eq_band_1:In"]
      outputs = ["post_gain:Out"]

      links = [
        ## Control block
        ## :: Inputs
        { output = "vol:Notify" input = "base_gain:Control" }
        { output = "base_gain:Notify" input = "base_gain_db:Control" }
        ## :: Equalizer
        { output = "base_gain_db:Notify" input = "eq_band_2_gain:Control" }
        { output = "eq_band_2_gain:Notify" input = "eq_band_2:Gain" }
        ## :: Post gain
        { output = "base_gain:Notify" input = "post_gain:Mult" }

        ## DSP block
        { output = "eq_band_1:Out" input = "eq_band_2:In" }
        { output = "eq_band_2:Out" input = "eq_band_3:In" }
        { output = "eq_band_3:Out" input = "eq_band_4:In" }
        { output = "eq_band_4:Out" input = "eq_band_5:In" }
        { output = "eq_band_5:Out" input = "post_gain:In" }
      ]

      ## Single entry on purpose:
      ## With N entries, channel i drives entry i % N
      capture.volumes = [{
        control = "vol:Control"
        min = 0.0
        max = 1.0
        scale = linear
      }]
    }
  }
}]
